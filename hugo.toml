baseURL = 'https://blog.com/'
languageCode = 'zh-CN'
title = '我的个人博客'
theme = 'hugo-theme-reimu'
<!-- DevOps PR test -->

defaultContentLanguage = 'zh-CN'
[languages]
[languages.en]
languageName = 'English'
weight = 2
contentDir = "content/en"
[languages.zh-CN]
languageName = '简体中文'
weight = 1
contentDir = "content/zh-CN" 
hasCJKLanguage = true
[languages.zh-TW]
languageName = '繁體中文'
weight = 3
contentDir = "content/zh-TW" 
hasCJKLanguage = true
[languages.ja]
languageName = '日本語'
weight = 4
contentDir = "content/ja" 
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]
<!-- DevOps PR test -->

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true
